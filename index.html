<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>모의주식 투자반</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="app-style">
  :root{
    --bg:#F5F1E6; --surface:#FFFFFF; --surface-2:#ECE5D3; --raise:#FFFFFF;
    --ink:#1A1B22; --ink-soft:#5C5E6B; --ink-faint:#8B8E9B; --line:#E2DAC7;
    --accent:#A9762E; --accent-ink:#14213D; --accent-soft:#F1E4C9;
    --up:#D6483F; --up-soft:#FBE4E1; --down:#2C63C7; --down-soft:#E3EBFB;
    --rumor:#C97A2B; --rumor-soft:#F6E6D2; --news:#1E7A6F; --news-soft:#DDEFEC;
    --shadow: 0 1px 2px rgba(20,20,20,.04), 0 8px 24px -12px rgba(20,20,20,.18);
    --radius: 14px;
    /* Deliberately theme-stable: a fixed navy solid + its readable light text, used for the
       topbar / primary buttons / toast. These never flip with light/dark so the pairing always
       stays high-contrast (unlike --accent-ink, which flips meaning between the two themes). */
    --brand-bg:#14213D; --brand-text:#F3EFE2; --brand-text-soft:#C9BE9E;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14151B; --surface:#1C1E26; --surface-2:#242631; --raise:#2A2C38;
      --ink:#EDEBE3; --ink-soft:#ABAEB9; --ink-faint:#767986; --line:#333543;
      --accent:#D9A94E; --accent-ink:#EDEBE3; --accent-soft:#3A331E;
      --up:#FF6E64; --up-soft:#3A1E1D; --down:#6FA0FF; --down-soft:#1B2740;
      --rumor:#E39A55; --rumor-soft:#3A2C18; --news:#54C2B3; --news-soft:#173330;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14151B; --surface:#1C1E26; --surface-2:#242631; --raise:#2A2C38;
    --ink:#EDEBE3; --ink-soft:#ABAEB9; --ink-faint:#767986; --line:#333543;
    --accent:#D9A94E; --accent-ink:#EDEBE3; --accent-soft:#3A331E;
    --up:#FF6E64; --up-soft:#3A1E1D; --down:#6FA0FF; --down-soft:#1B2740;
    --rumor:#E39A55; --rumor-soft:#3A2C18; --news:#54C2B3; --news-soft:#173330;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }
  #app{ max-width:720px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding-bottom:78px; }
  a{ color:inherit; }
  button{ font-family:inherit; }

  /* top bar */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--brand-bg); color:var(--brand-text);
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .topbar .brand{ display:flex; flex-direction:column; gap:1px; }
  .topbar .brand b{ font-size:15px; font-weight:700; letter-spacing:.2px; }
  .topbar .brand span{ font-size:11px; color:var(--brand-text-soft); }
  .topbar .clock{ text-align:right; font-size:11px; color:var(--brand-text-soft); }
  .topbar .clock b{ display:block; font-size:14px; color:var(--brand-text); font-weight:600; }
  .status-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; background:var(--ink-faint); }
  .status-dot.live{ background:#4CD97B; box-shadow:0 0 0 3px rgba(76,217,123,.25); }
  .status-dot.closed{ background:#D6483F; }

  /* ticker tape */
  .tickerwrap{ background:var(--surface-2); border-bottom:1px solid var(--line); overflow:hidden; position:relative; }
  .tickertrack{ display:flex; gap:0; width:max-content; animation: scrollTicker 42s linear infinite; }
  .tickertrack.paused{ animation-play-state: paused; }
  @keyframes scrollTicker{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }
  @media (prefers-reduced-motion: reduce){ .tickertrack{ animation:none; } }
  .tick{ display:flex; align-items:center; gap:7px; padding:8px 16px; border-right:1px solid var(--line); white-space:nowrap; font-size:12.5px; }
  .tick .nm{ color:var(--ink-soft); font-weight:500; }
  .tick .pr{ font-weight:600; }
  .tick .chg{ font-weight:600; }
  .up-text{ color:var(--up); } .down-text{ color:var(--down); }

  main{ flex:1; padding:14px 16px 24px; display:flex; flex-direction:column; gap:14px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; }
  .card h2{ margin:0 0 10px; font-size:13px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* login */
  .login-card{ margin-top:10vh; }
  .login-card h1{ font-size:20px; margin:0 0 4px; }
  .login-card p{ margin:0 0 16px; color:var(--ink-soft); font-size:13.5px; line-height:1.5; }
  label{ display:block; font-size:12px; color:var(--ink-soft); margin:0 0 4px; }
  input[type="text"], input[type="number"], input[type="password"], input[type="date"], select{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:16px; font-family:inherit;
  }
  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .field{ margin-bottom:12px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 16px; border-radius:10px; border:1px solid transparent; cursor:pointer;
    font-size:14.5px; font-weight:600; width:100%;
  }
  .btn-primary{ background:var(--brand-bg); color:var(--brand-text); }
  .btn-primary:hover{ opacity:.92; }
  .btn-up{ background:var(--up); color:#fff; }
  .btn-down{ background:var(--down); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }
  .btn-sm{ width:auto; padding:7px 12px; font-size:13px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .err{ color:var(--up); font-size:12.5px; margin-top:6px; }
  .hint{ color:var(--ink-faint); font-size:12px; margin-top:8px; line-height:1.5;}

  /* market list */
  .stock-item{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .stock-item:last-child{ border-bottom:none; }
  .stock-item:hover{ background:var(--surface-2); }
  .stock-item .sp{ flex:1; min-width:0; }
  .stock-item .sp .nm{ font-weight:600; font-size:14.5px; }
  .stock-item .sp .sector{ font-size:11.5px; color:var(--ink-faint); }
  .stock-item .price-col{ text-align:right; min-width:92px; }
  .stock-item .price-col .pr{ font-weight:700; font-size:14.5px; }
  .stock-item .price-col .chg{ font-size:11.5px; font-weight:600; }
  .spark{ width:64px; height:28px; flex-shrink:0; }

  .tag{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; letter-spacing:.02em; }
  .tag-news{ background:var(--news-soft); color:var(--news); }
  .tag-rumor{ background:var(--rumor-soft); color:var(--rumor); }
  .tag-debunk{ background:var(--news-soft); color:var(--news); }
  .tag-admin{ background:var(--accent-soft); color:var(--accent); }

  /* detail / trade */
  .backlink{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:2px; }
  .detail-price{ font-size:30px; font-weight:700; }
  .detail-chg{ font-size:14px; font-weight:600; }
  .chartbox{ width:100%; height:150px; margin:10px 0 2px; }
  .segmented{ display:flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:3px; }
  .segmented button{ flex:1; border:none; background:transparent; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .segmented button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .qty-row{ display:flex; align-items:center; gap:8px; }
  .qty-row button{ width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:17px; cursor:pointer; color:var(--ink); }
  .qty-row input{ text-align:center; }
  .trade-summary{ display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); padding:4px 0; }
  .trade-summary b{ color:var(--ink); font-weight:600; }
  .vol-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .vol-row b{ font-weight:700; }
  .vol-bar{ display:flex; width:100%; height:8px; border-radius:5px; overflow:hidden; background:var(--surface-2); margin:5px 0 10px; }
  .vol-bar .buy-seg{ background:var(--up); height:100%; }
  .vol-bar .sell-seg{ background:var(--down); height:100%; }

  /* 호가창 */
  .hoga-row{ display:flex; align-items:center; gap:8px; padding:2.5px 0; }
  .hoga-row .hoga-price{ width:66px; text-align:right; font-size:12.5px; font-weight:700; flex-shrink:0; }
  .hoga-row .hoga-bar-wrap{ flex:1; height:16px; background:var(--surface-2); border-radius:3px; overflow:hidden; position:relative; }
  .hoga-row .hoga-bar{ height:100%; }
  .hoga-ask .hoga-price{ color:var(--down); }
  .hoga-ask .hoga-bar{ background:var(--down-soft); margin-left:auto; }
  .hoga-bid .hoga-price{ color:var(--up); }
  .hoga-bid .hoga-bar{ background:var(--up-soft); }
  .hoga-row .hoga-qty{ width:48px; text-align:right; font-size:11.5px; color:var(--ink-faint); flex-shrink:0; }
  .hoga-mid{ text-align:center; padding:6px 0; margin:2px 0; font-weight:700; font-size:14px; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); }

  /* portfolio */
  .stat-tile{ background:var(--surface-2); border-radius:12px; padding:12px; }
  .stat-tile .lbl{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }
  .stat-tile .val{ font-size:17px; font-weight:700; }
  .holding-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .holding-row:last-child{ border:none; }
  .holding-row .nm{ font-weight:600; font-size:14px; }
  .holding-row .sub{ font-size:11.5px; color:var(--ink-faint); }
  .holding-row .right{ text-align:right; }
  .trade-log-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .trade-log-row:last-child{ border:none; }
  .trade-log-row .side-buy{ color:var(--up); font-weight:700; }
  .trade-log-row .side-sell{ color:var(--down); font-weight:700; }

  /* notices */
  .notice{ padding:12px 0; border-bottom:1px solid var(--line); }
  .notice:last-child{ border:none; }
  .notice .head{ display:flex; align-items:center; gap:7px; margin-bottom:5px; flex-wrap:wrap; }
  .notice .stockname{ font-weight:600; font-size:13.5px; }
  .notice .ts{ font-size:11px; color:var(--ink-faint); margin-left:auto; }
  .notice .headline{ font-weight:600; font-size:14.5px; margin:0 0 4px; line-height:1.4; }
  .notice .body{ font-size:13px; color:var(--ink-soft); line-height:1.55; margin:0; }

  /* ranking */
  .rank-row{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .rank-row:last-child{ border:none; }
  .rank-row.me{ background:var(--accent-soft); border-radius:10px; }
  .rank-num{ width:26px; text-align:center; font-weight:700; color:var(--ink-faint); font-size:13.5px; }
  .rank-row:nth-child(1) .rank-num{ color:#C9962E; }
  .rank-row:nth-child(2) .rank-num{ color:#9AA0AC; }
  .rank-row:nth-child(3) .rank-num{ color:#B5773E; }
  .rank-name{ flex:1; min-width:0; }
  .rank-name .nm{ font-weight:600; font-size:14px; }
  .rank-name .code{ font-size:11px; color:var(--ink-faint); }
  .rank-val{ text-align:right; }
  .rank-val .amt{ font-weight:700; font-size:13.5px; }
  .rank-val .pct{ font-size:12px; font-weight:600; }
  .empty{ text-align:center; color:var(--ink-faint); font-size:13px; padding:24px 0; }

  /* onboarding gate */
  .onboard-card h1{ font-size:19px; margin:0 0 14px; }
  .onboard-section{ margin-bottom:14px; }
  .onboard-section h3{ font-size:13.5px; margin:0 0 4px; color:var(--accent); }
  .onboard-section p{ font-size:13px; color:var(--ink-soft); line-height:1.55; margin:0; }
  .onboard-check{ margin:16px 0 14px; padding-top:12px; border-top:1px solid var(--line); }
  .check-row{ display:flex; align-items:flex-start; gap:8px; font-size:13.5px; color:var(--ink); margin-bottom:10px; cursor:pointer; }
  .check-row input{ width:auto; margin-top:2px; flex-shrink:0; }

  /* trading journal */
  .journal-row{ padding:12px 0; border-bottom:1px solid var(--line); }
  .journal-row:last-child{ border:none; }
  .journal-row .head{ display:flex; align-items:center; gap:7px; font-size:13.5px; }
  .journal-row .head .ts{ margin-left:auto; font-size:11px; color:var(--ink-faint); }
  .journal-row .side-buy{ color:var(--up); font-weight:700; }
  .journal-row .side-sell{ color:var(--down); font-weight:700; }
  .journal-reason{
    width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-family:inherit; font-size:16px; resize:vertical;
  }
  .journal-row-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:7px; }
  .journal-status{ font-size:11.5px; color:var(--ink-faint); }
  .journal-status.ok{ color:var(--news); font-weight:600; }
  .journal-row-foot .btn{ width:auto; padding:6px 14px; font-size:12.5px; }

  /* bottom nav */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; max-width:720px; margin:0 auto;
  }
  .tabbar button{
    flex:1; background:none; border:none; padding:9px 4px 8px; display:flex; flex-direction:column;
    align-items:center; gap:3px; color:var(--ink-faint); font-size:10.5px; font-weight:600; cursor:pointer;
  }
  .tabbar button .ic{ width:21px; height:21px; }
  .tabbar button.active{ color:var(--accent); }
  .tabbar button.active .ic{ color:var(--accent); }

  .modal-backdrop{ position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(20,18,12,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:560px){ .modal-backdrop{ align-items:center; } }
  .modal{ background:var(--surface); border-radius:18px 18px 0 0; width:100%; max-width:480px; max-height:88vh; overflow:auto; padding:20px; }
  @media (min-width:560px){ .modal{ border-radius:18px; } }
  .modal h3{ margin:0 0 4px; font-size:16px; }
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:60;
    background:var(--brand-bg); color:var(--brand-text); padding:10px 16px; border-radius:10px; font-size:13px;
    box-shadow:var(--shadow); max-width:88%; text-align:center;
  }
  .divider{ height:1px; background:var(--line); margin:12px 0; border:none; }
  .admin-link{ text-align:center; padding:14px 0 4px; }
  .admin-link button{ background:none; border:none; color:var(--ink-faint); font-size:11.5px; cursor:pointer; text-decoration:underline; }
  .kv{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line); }
  .kv:last-child{ border:none; }

  /* hosted (Firebase) version additions */
  #vr-top, #vr-ticker, #vr-main{ display:contents; }
  .conn-banner{ background:var(--rumor-soft); color:var(--rumor); font-size:12.5px; font-weight:600; text-align:center; padding:7px 12px; border-bottom:1px solid var(--line); }
  .boot-card{ margin-top:14vh; text-align:center; }
  .boot-card h1{ font-size:17px; margin:0 0 8px; }
  .boot-card p{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:0; text-align:left; }
  .boot-card code{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:12px; background:var(--surface-2); padding:1px 5px; border-radius:4px; }
  .linkish{ background:none; border:none; padding:0; color:var(--ink-faint); font-size:12px; text-decoration:underline; cursor:pointer; }
  .admin-student-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .admin-student-row:last-child{ border:none; }
  .admin-student-row .btn{ width:auto; padding:5px 10px; font-size:12px; }
  .index-card .index-val{ font-size:26px; font-weight:700; line-height:1.15; }
  .index-card .index-spark .spark{ width:120px; height:44px; }
  .stock-desc{ font-size:13.5px; color:var(--ink); line-height:1.6; margin:0; }
  .recent-news-title{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .recent-news{ display:flex; align-items:baseline; gap:6px; font-size:12.5px; padding:4px 0; }
  .recent-news .rn-head{ flex:1; min-width:0; color:var(--ink); line-height:1.4; }
  .recent-news .rn-ts{ flex-shrink:0; font-size:11px; color:var(--ink-faint); }
  .recent-news .tag{ flex-shrink:0; }
</style>
</head>
<body>
<div id="app">
  <div id="view-root"><div id="vr-top"></div><div id="vr-ticker"></div><div id="vr-main"></div></div>

/* ============ 2. TIME / KST HELPERS ============ */
function kstPartsFromMs(ms){
  var f = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
  var parts = {}; f.formatToParts(new Date(ms)).forEach(function(p){ parts[p.type] = p.value; });
  return { y:+parts.year, mo:+parts.month, d:+parts.day, h:+parts.hour===24?0:+parts.hour, mi:+parts.minute, s:+parts.second };
}
// Convert a KST calendar date (YYYY-MM-DD) + H:M to a UTC epoch ms
function kstDateToMs(dateStr, h, mi){
  var bits = dateStr.split('-').map(Number);
  // Date.UTC gives ms for that Y-M-D H:M taken as UTC; KST = UTC+9, so subtract 9h to get true UTC instant
  return Date.UTC(bits[0], bits[1]-1, bits[2], h, mi, 0) - 9*3600*1000;
}
function addDaysStr(dateStr, n){
  var bits = dateStr.split('-').map(Number);
  var ms = Date.UTC(bits[0], bits[1]-1, bits[2]) + n*86400000;
  var d = new Date(ms);
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function fmtClock(ms){
  var p = kstPartsFromMs(ms);
  return String(p.h).padStart(2,'0')+':'+String(p.mi).padStart(2,'0');
}
function fmtDateShort(ms){
  var p = kstPartsFromMs(ms);
  return (p.mo)+'/'+(p.d)+' '+String(p.h).padStart(2,'0')+':'+String(p.mi).padStart(2,'0');
}

function slotMsFor(dateStr, timeStr){
  var hm = timeStr.split(':');
  return kstDateToMs(dateStr, +hm[0], +hm[1]);
}

// 학교 일과(쉬는시간) 스케줄에 맞춘 상태 계산: 매일 08:00 개장 + 쉬는시간마다 가격 갱신,
// 매매는 쉬는시간(및 점심시간, 방과후 거래시간) 동안만 허용된다. Day1~8은 하교 후 17:30~20:00에도
// 거래시간이 한 번 더 열린다. 마지막 날(Day9)은 낮 12:00에 게임이 종료되므로 오전 쉬는시간까지만
// 진행되고(방과후 거래시간 없음), finalClose가 그 날의 실제 종료 시각을 별도로 지정한다.
function getMarketStatus(nowMs){
  var cfg = STATE.config;
  if(!cfg.day1Date){ return { phase:'unconfigured', idx:0, day:0, label:'게임 준비 중', tradingOpen:false }; }
  for(var i=0;i<N_DAYS;i++){
    var ds = addDaysStr(cfg.day1Date, DAYS[i].offset);
    var daySlots = DAYS[i].slots;
    var slotMs = daySlots.map(function(s){ return slotMsFor(ds, s.time); });
    var dayOpenMs = slotMs[0];
    var lastSlot = daySlots[daySlots.length-1];
    var finalCloseTime = DAYS[i].finalClose || lastSlot.tradeEnd;
    var dayFinalCloseMs = slotMsFor(ds, finalCloseTime);

    if(i===0 && nowMs < dayOpenMs){
      return { phase:'before', idx:0, day:0, label:'게임 시작 전', tradingOpen:false, nextOpen:dayOpenMs };
    }
    if(nowMs >= dayOpenMs && nowMs <= dayFinalCloseMs){
      var j = 0;
      for(var k=0;k<slotMs.length;k++){ if(slotMs[k] <= nowMs) j = k; }
      var slot = daySlots[j];
      var slotStartMs = slotMs[j];
      var tradingOpen = false, tradeEndMs = null, nextTradeMs = null, nextTradeLabel = null;
      // slot.ticks 슬롯이 거래 가능하면 그 시간(분) 만큼 1분 단위로 틱이 쪼개져 있으므로,
      // 그 안에서 지난 분(分)만큼 idx를 전진시켜 실시간처럼 가격이 움직이게 한다. 슬롯이
      // 끝났거나(수업 중) 애초에 거래 불가능한 슬롯이면 그 슬롯의 마지막(또는 유일한) 틱의
      // 가격을 그대로 보여준다.
      var minuteOffset = 0;
      if(slot.tradeEnd){
        tradeEndMs = slotMsFor(ds, slot.tradeEnd);
        if(nowMs < tradeEndMs){
          tradingOpen = true;
          minuteOffset = Math.floor((nowMs - slotStartMs) / 60000);
          if(minuteOffset < 0) minuteOffset = 0;
          if(minuteOffset >= slot.ticks) minuteOffset = slot.ticks - 1;
        } else {
          minuteOffset = slot.ticks - 1;
        }
      }
      var idx = DAY_OFFSETS[i] + DAY_SLOT_TICK_OFFSET[i][j] + minuteOffset;
      if(!tradingOpen){
        for(var k2=j+1;k2<daySlots.length;k2++){
          if(daySlots[k2].tradeEnd){ nextTradeMs = slotMs[k2]; nextTradeLabel = daySlots[k2].label; break; }
        }
      }
      var label;
      if(tradingOpen) label = slot.label + ' · 거래 가능';
      else if(nextTradeMs) label = '대기 중 · 다음 거래 ' + fmtClock(nextTradeMs);
      else if(i === N_DAYS-1) label = '대기 중 · 곧 게임 종료(' + fmtClock(dayFinalCloseMs) + ')';
      else label = 'DAY ' + (i+1) + ' 장마감';
      return { phase: tradingOpen?'trading':'inclass', idx:idx, day:i, label:label,
        tradingOpen:tradingOpen, tradeEndMs:tradeEndMs, nextTradeMs:nextTradeMs, nextTradeLabel:nextTradeLabel };
    }
    if(nowMs > dayFinalCloseMs){
      if(i === N_DAYS-1){
        return { phase:'ended', idx:TOTAL_TICKS-1, day:N_DAYS-1, label:'게임 종료', tradingOpen:false };
      }
      var dsNext = addDaysStr(cfg.day1Date, DAYS[i+1].offset);
      var nextOpenMs = slotMsFor(dsNext, DAYS[i+1].slots[0].time);
      if(nowMs < nextOpenMs){
        var idxClosed = DAY_OFFSETS[i] + DAY_SLOT_TICK_OFFSET[i][daySlots.length-1] + (lastSlot.ticks-1);
        return { phase:'closed', idx: idxClosed, day:i, label:'DAY '+(i+1)+' 장마감 · 다음 거래 '+fmtDateShort(nextOpenMs),
          tradingOpen:false, nextOpen: nextOpenMs };
      }
      // nowMs already within/after the next day — let the loop continue to that day
    }
  }
  return { phase:'unconfigured', idx:0, day:0, label:'게임 준비 중', tradingOpen:false };
}

// 받아 온 틱 중 idx 이하에서 가장 최근 것(아직 못 받았으면 시작가). 게임 시작 전에는 시작가가 보인다.
function tickAtOrBefore(idx){
  if(idx >= TOTAL_TICKS) idx = TOTAL_TICKS - 1;
  for(var t=idx;t>=0;t--){ if(MKT.ticks[t]) return MKT.ticks[t]; }
  return null;
}
function tickLoaded(idx){ return !!MKT.ticks[idx]; }
function priceAt(stockId, idx){
  var tk = tickAtOrBefore(idx);
  return tk ? tk.p[stockId] : STOCK_MAP[stockId].start;
}
// 도개지수: 10종목을 같은 비중으로 담았을 때의 평균 움직임(시작 1,000).
function indexAt(idx){
  var tk = tickAtOrBefore(idx);
  return tk ? tk.x : MARKET.index.base;
}
// 0..idx 구간의 가격 배열(못 받은 틱은 직전 값으로 채움) — 차트·고가·저가용
function seriesUpTo(stockId, idx){
  var out = [], last = stockId ? STOCK_MAP[stockId].start : MARKET.index.base;
  if(idx >= TOTAL_TICKS) idx = TOTAL_TICKS - 1;
  for(var t=0;t<=idx;t++){
    var tk = MKT.ticks[t];
    if(tk) last = stockId ? tk.p[stockId] : tk.x;
    out.push(last);
  }
  return out;
}
function indexBaseline(day){
  if(day <= 0) return MARKET.index.base;
  return indexAt(DAY_OFFSETS[day] - 1);
}
function fmtIndex(v){ return v.toLocaleString('ko-KR', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function baselinePrice(stockId, day){
  if(day <= 0) return STOCK_MAP[stockId].start;
  return priceAt(stockId, DAY_OFFSETS[day] - 1);
}
// 오늘(현재 day) 안에서의 시가/고가/저가 — 당일 첫 틱부터 현재 idx까지의 구간.
function todayRange(stockId, status){
  if(status.day == null || status.idx == null) return null;
  var arr = seriesUpTo(stockId, status.idx);
  var endIdx = arr.length - 1;
  var startIdx = DAY_OFFSETS[status.day] || 0;
  if(endIdx < startIdx) startIdx = endIdx;
  var slice = arr.slice(startIdx, endIdx + 1);
  if(!slice.length) slice = [arr[endIdx]];
  return { open: slice[0], high: Math.max.apply(null, slice), low: Math.min.apply(null, slice) };
}

// ---- 시세·뉴스 조각 받아 오기 ----
function day1Ms(){ return kstDateToMs(STATE.config.day1Date, 0, 0); }
function marketReady(){ return !!(MKT.meta && MKT.meta.sig === MARKET.sig); }
function parseTick(str){
  var parts = String(str).split('|'), ps = parts[0].split(','), o = {};
  STOCKS.forEach(function(s, i){ o[s.id] = +ps[i]; });
  return { p:o, x:+parts[1] };
}
function addEvents(list){
  (list || []).forEach(function(e){
    if(!e || MKT.evSeen[e.i] || !STOCK_MAP[e.s] || typeof e.r !== 'number') return;
    MKT.evSeen[e.i] = true;
    MKT.events.push({ i:e.i, rel:e.r, s:e.s, t:e.t, h:String(e.h||''), b:String(e.b||'') });
  });
}
function fetchPiece(path, onVal){
  if(MKT.inflight[path] || (MKT.retryAt[path] && Date.now() < MKT.retryAt[path])) return;
  MKT.inflight[path] = true;
  FB.db.ref('market/' + path + '/d').once('value').then(function(s){
    delete MKT.inflight[path];
    if(s.exists()){ onVal(s.val()); liveRender(); }
    else MKT.retryAt[path] = Date.now() + 15000;
  }, function(){
    // 아직 공개 시각 전이거나(서버 시계와 몇 초 차이) 연결 문제 — 잠시 뒤 다시 시도
    delete MKT.inflight[path];
    MKT.retryAt[path] = Date.now() + 3000;
  });
}
function marketSync(){
  if(FB.phase !== 'ready' || !marketReady() || !STATE.config.day1Date) return;
  var base = day1Ms(), now = nowMs() - 1000;
  // 시세: 끝난 날은 하루치 한 번에, 진행 중인 날은 공개된 1분 조각을 하나씩
  for(var d=0; d<N_DAYS; d++){
    var first = DAY_OFFSETS[d], last = first + DAY_TICK_COUNTS[d] - 1;
    if(base + TICK_REL[first] > now) break;
    if(MKT.dayLoaded[d]) continue;
    if(base + TICK_REL[last] <= now){
      (function(dd, f0){
        fetchPiece('pd/' + dd, function(v){
          String(v).split(';').forEach(function(str, k){ MKT.ticks[f0 + k] = parseTick(str); });
          MKT.dayLoaded[dd] = true;
        });
      })(d, first);
    } else {
      for(var t=first; t<=last && base + TICK_REL[t] <= now; t++){
        if(MKT.ticks[t]) continue;
        (function(tt){ fetchPiece('p/' + tt, function(v){ MKT.ticks[tt] = parseTick(v); }); })(t);
      }
    }
  }
  // 뉴스: 지난 날짜는 하루치, 오늘은 공개된 시각의 묶음을 하나씩
  NEWS_CAL_DAYS.forEach(function(cd){
    if(MKT.newsDayLoaded[cd]) return;
    if(base + (cd + 1) * DAY_MS <= now){
      fetchPiece('nd/' + cd, function(v){
        var list = []; try{ list = JSON.parse(v); }catch(e){}
        addEvents(list);
        MKT.newsDayLoaded[cd] = true;
      });
      return;
    }
    NEWS_REL.forEach(function(r, k){
      if(Math.floor(r / DAY_MS) !== cd || MKT.newsLoaded[k] || base + r > now) return;
      fetchPiece('n/' + k, function(v){
        var list = []; try{ list = JSON.parse(v); }catch(e){}
        addEvents(list);
        MKT.newsLoaded[k] = true;
      });
    });
  });
}
// 반 전체 학생들의 해당 종목 누적 매수/매도량 — 학생별 거래내역(trades, 최근 40건까지 보관)을
// 모두 훑어 집계한다. 학생 수가 많지 않은 교실 단위라 매 렌더마다 다시 계산해도 가볍다.
function classVolume(stockId){
  var buyQty = 0, sellQty = 0, buyCount = 0, sellCount = 0;
  for(var key in STATE.students){
    var s = STATE.students[key];
    if(!s || !s.trades) continue;
    for(var i=0;i<s.trades.length;i++){
      var t = s.trades[i];
      if(t.stockId !== stockId) continue;
      if(t.side === 'buy'){ buyQty += t.qty; buyCount++; }
      else { sellQty += t.qty; sellCount++; }
    }
  }
  return { buyQty:buyQty, sellQty:sellQty, buyCount:buyCount, sellCount:sellCount };
}
// 가격대별 호가 단위(원) — generate_prices.py의 to_tick()과 동일한 기준.
function tickUnitFor(price){
  if(price < 2000) return 1;
  if(price < 5000) return 5;
  if(price < 20000) return 10;
  if(price < 50000) return 50;
  return 100;
}
// 문자열을 숫자 시드로 바꾸는 간단한 해시 (실제 주문장이 없으므로, 같은 시점엔 항상 같은
// 잔량이 나오도록 결정론적으로 생성한다 — 렌더할 때마다 숫자가 들쭉날쭉 바뀌지 않게).
function hashSeed(str){
  var h = 0;
  for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return h;
}
function seededRand(seed){
  var x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}
// 호가창(매도 5단계 + 매수 5단계)을 만든다. 실제 거래소처럼 지정가 주문이 쌓이는 구조는
// 아니며(이 게임은 항상 현재가로 즉시 체결되는 시장가 매매만 지원), 호가 단위·매수/매도
// 잔량 개념을 보여주기 위한 학습용 시각화다. 같은 틱(idx) 동안에는 같은 잔량이 유지된다.
function buildOrderBook(stockId, status){
  var price = priceAt(stockId, status.idx);
  var unit = tickUnitFor(price);
  var asks = [], bids = [];
  for(var i=5;i>=1;i--){
    asks.push({ price: price + i*unit, qty: Math.floor(seededRand(hashSeed(stockId+':'+status.idx+':ask:'+i)) * 180) + 20 });
  }
  for(var j=1;j<=5;j++){
    bids.push({ price: price - j*unit, qty: Math.floor(seededRand(hashSeed(stockId+':'+status.idx+':bid:'+j)) * 180) + 20 });
  }
  var maxQty = Math.max.apply(null, asks.concat(bids).map(function(r){ return r.qty; }).concat([1]));
  return { asks:asks, bids:bids, unit:unit, maxQty:maxQty };
}

/* ============ 3. STUDENT IDENTITY ============ */
function loadMe(){
  try{ var raw = localStorage.getItem('msi_me'); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveMe(me){
  try{ if(me) localStorage.setItem('msi_me', JSON.stringify(me)); else localStorage.removeItem('msi_me'); }catch(e){}
}
// 학생 한 명을 가리키는 데이터베이스 키. 실시간 데이터베이스 키에 쓸 수 없는 문자(. # $ [ ] /)는 뺀다.
function studentKeyOf(code, name){
  return (code.trim()+'_'+name.trim()).replace(/\s+/g,'').replace(/[.#$\[\]\/\u0000-\u001f\u007f]/g,'').slice(0,60);
}
function sha256Hex(str){
  var bytes = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', bytes).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
  });
}
// 비밀번호는 원문을 저장하지 않고 해시만 보낸다. 해시는 데이터베이스에서도 아무도 읽을 수 없게
// 규칙으로 막혀 있고, "내가 보낸 해시가 저장된 해시와 같은가"만 서버 규칙이 판정한다.
function pinHash(key, pin){ return sha256Hex('mockstock-pin:' + key + ':' + pin); }
function adminHash(pw){ return sha256Hex('mockstock-admin:' + pw); }

/* ============ 4. SHARED STATE (Firebase 실시간 데이터베이스) ============ */
// 저장 구조 (database.rules.json 과 짝):
//   config                    게임 설정(시작일, 긴급 뉴스). 모두 읽기, 관리자만 쓰기
//   students/<key>            학생별 현금·보유 종목. 모두 읽기(랭킹), 본인만 쓰기
//   trades/<key>/<거래id>     학생별 체결 기록. 모두 읽기(반 전체 거래량), 본인만 추가(수정 불가)
//   journal/<key>/<거래id>    매매일지 근거. 본인과 관리자만 읽기/쓰기
//   secrets/<key>             학생 비밀번호 해시. 아무도 읽지 못함
//   owners/<key>/<기기uid>    그 학생으로 로그인한 기기. 비밀번호 해시가 맞아야만 등록됨
//   private/adminHash, admins/<기기uid>   관리자 비밀번호 해시와 관리자로 로그인한 기기
// 학생마다 자기 자리(students/<key>, trades/<key>)에만 쓰기 때문에, 여러 학생이 같은 순간에
// 거래해도 서로의 저장을 덮어쓰지 않는다.
var FB = { db:null, auth:null, uid:null, phase:'boot', errorKind:null, errorDetail:'', connected:false,
           gotConfig:false, gotStudents:false, gotTrades:false };
var RAW = { students:{}, trades:{}, journal:{} };
// 기기 시계가 아니라 서버 시계를 기준으로 삼는다 (휴대폰 시간을 바꿔도 장 시간이 바뀌지 않게).
var SERVER_OFFSET = 0;
function nowMs(){ return Date.now() + SERVER_OFFSET; }

function isDenied(err){
  var c = err && (err.code || err.message || '');
  return String(c).toUpperCase().indexOf('PERMISSION_DENIED') >= 0;
}

function applyConfig(v){
  v = v || {};
  var notices = v.customNotices || {};
  var list = Object.keys(notices).map(function(id){
    var n = notices[id] || {};
    return { id:id, ts:+n.ts||0, title:String(n.title||''), body:String(n.body||'') };
  }).sort(function(a,b){ return a.ts - b.ts; });
  STATE.config = {
    day1Date: (typeof v.day1Date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v.day1Date)) ? v.day1Date : '2026-10-12',
    customNotices: list,
    adminSet: v.adminSet === true,
    day1Ms: typeof v.day1Ms === 'number' ? v.day1Ms : null
  };
}

// 데이터베이스에서 받은 원본(RAW)을 화면 코드가 쓰는 STATE.students 모양으로 다시 짠다.
// (실시간 데이터베이스는 빈 객체를 저장하지 않으므로 holdings/trades 가 없을 수 있다.)
function rebuildState(){
  var out = {};
  Object.keys(RAW.students || {}).forEach(function(key){
    var r = RAW.students[key];
    if(!r || typeof r !== 'object') return;
    var holdings = {};
    var rh = r.holdings || {};
    Object.keys(rh).forEach(function(id){ var q = Math.floor(+rh[id]); if(STOCK_MAP[id] && q > 0) holdings[id] = q; });
    var tmap = (RAW.trades && RAW.trades[key]) || {};
    var mine = !!(UI.me && UI.me.key === key);
    var trades = Object.keys(tmap).map(function(tid){
      var t = tmap[tid] || {};
      return { id:tid, ts:+t.ts||0, stockId:t.stockId, side:(t.side==='sell'?'sell':'buy'), qty:+t.qty||0, price:+t.price||0, total:+t.total||0,
               reason: mine ? String((RAW.journal && RAW.journal[tid]) || '') : '' };
    }).filter(function(t){ return !!STOCK_MAP[t.stockId]; }).sort(function(a,b){ return b.ts - a.ts; });
    out[key] = { code:String(r.code||''), name:String(r.name||''), cash:+r.cash||0, holdings:holdings, trades:trades,
                 joinedAt:+r.joinedAt||0, onboarded:r.onboarded === true };
  });
  STATE.students = out;
}

function bootFail(kind, detail){
  FB.phase = 'error'; FB.errorKind = kind; FB.errorDetail = detail ? String(detail) : '';
  render();
}

function bootFirebase(){
  var cfg = null;
  try{ cfg = JSON.parse(document.getElementById('firebase-config').textContent); }catch(e){ cfg = null; }
  if(!cfg || !cfg.apiKey){ bootFail('no-config'); return; }
  if(!cfg.databaseURL){ bootFail('no-dburl'); return; }
  if(!window.firebase || !firebase.initializeApp || !firebase.auth || !firebase.database){ bootFail('no-sdk'); return; }
  if(!window.crypto || !crypto.subtle){ bootFail('no-crypto'); return; }
  try{
    firebase.initializeApp(cfg);
    FB.auth = firebase.auth();
    FB.db = firebase.database();
  }catch(e){ bootFail('init', e && e.message); return; }
  FB.phase = 'auth'; render();
  FB.auth.onAuthStateChanged(function(user){
    if(user && FB.uid !== user.uid){ FB.uid = user.uid; startListeners(); }
  });
  FB.auth.signInAnonymously().catch(function(err){ bootFail('auth', err && (err.code || err.message)); });
}

var listenersStarted = false;
function startListeners(){
  if(listenersStarted) return;
  listenersStarted = true;
  FB.phase = 'sync'; render();
  var onErr = function(err){ bootFail(isDenied(err) ? 'rules' : 'db', err && (err.code || err.message)); };
  FB.db.ref('.info/serverTimeOffset').on('value', function(s){ SERVER_OFFSET = +s.val() || 0; });
  FB.db.ref('.info/connected').on('value', function(s){ FB.connected = s.val() === true; liveRender(); });
  FB.db.ref('config').on('value', function(s){ applyConfig(s.val()); FB.gotConfig = true; afterSnapshot(); }, onErr);
  FB.db.ref('students').on('value', function(s){ RAW.students = s.val() || {}; FB.gotStudents = true; afterSnapshot(); }, onErr);
  FB.db.ref('trades').on('value', function(s){ RAW.trades = s.val() || {}; FB.gotTrades = true; afterSnapshot(); }, onErr);
  FB.db.ref('market/meta').on('value', function(s){
    var m = s.val();
    // 데이터를 새로 올리면(또는 다른 버전이면) 받아 둔 조각을 버리고 다시 받는다
    if(!m || !MKT.meta || m.sig !== MKT.meta.sig || m.uploadedAt !== MKT.meta.uploadedAt){
      MKT.ticks = {}; MKT.dayLoaded = {}; MKT.events = []; MKT.evSeen = {}; MKT.newsLoaded = {}; MKT.newsDayLoaded = {}; MKT.retryAt = {};
    }
    MKT.meta = m; MKT.gotMeta = true; marketSync(); liveRender();
  }, function(){ MKT.gotMeta = true; liveRender(); });
}

function afterSnapshot(){
  rebuildState();
  marketSync();
  if(FB.phase === 'sync' && FB.gotConfig && FB.gotStudents && FB.gotTrades){
    FB.phase = 'ready';
    restoreSession();
  }
  // 관리자가 내 계정을 지웠으면(개별 삭제/전체 초기화) 참가 화면으로 돌아간다.
  if(FB.phase === 'ready' && UI.sessionChecked && UI.me && !UI.joining && !STATE.students[UI.me.key]){
    signOutLocal();
    toast('계정이 초기화됐어요. 다시 참가해 주세요.');

}

var journalRef = null, ownerRef = null;
function attachJournal(key){
  detachJournal();
  journalRef = FB.db.ref('journal/' + key);
  journalRef.on('value', function(s){ RAW.journal = s.val() || {}; rebuildState(); liveRender(); }, function(){ /* 권한이 사라지면 조용히 비운다 */ RAW.journal = {}; });
  // 선생님이 내 비밀번호를 초기화하면 이 기기의 등록이 지워진다 → 다시 로그인하도록 참가 화면으로 보낸다.
  ownerRef = FB.db.ref('owners/' + key + '/' + FB.uid);
  ownerRef.on('value', function(s){
    if(s.exists() || UI.joining || !UI.me || UI.me.key !== key) return;

}
function detachJournal(){
  if(journalRef){ journalRef.off(); journalRef = null; }
  if(ownerRef){ ownerRef.off(); ownerRef = null; }
  RAW.journal = {};
}
function signOutLocal(){
  detachJournal();

// 매수/매도. 현금·보유수량 변경과 체결 기록 추가를 한 번의 원자적 쓰기로 보낸다(둘 다 되거나 둘 다 안 됨).
// 체결 시각은 서버가 찍는다(규칙이 "ts === 서버 현재시각"만 허용).
// 수수료·세금: 매수/매도 때마다 매매수수료 0.015%, 매도할 때만 거래세 0.18% (원 단위 반올림).
// 체결 기록(total)은 수수료 전 금액으로 저장하고, 수수료·세금은 이 함수로 항상 같은 값이 다시 계산된다.
var FEE_RATE = 0.00015, TAX_RATE = 0.0018;
function calcCosts(side, total){
  var fee = Math.round(total * FEE_RATE);
  var tax = side === 'sell' ? Math.round(total * TAX_RATE) : 0;
  return { fee:fee, tax:tax, cost:fee + tax };
}
function submitTrade(stockId, side, qty){
  var me = UI.me, s = me && STATE.students[me.key];
  if(!s) return Promise.reject({ ui:'계정을 찾을 수 없어요.' });
  if(!FB.connected) return Promise.reject({ ui:'인터넷 연결이 끊겼어요. 연결된 뒤 다시 시도하세요.' });
  var status = getMarketStatus(nowMs());
  if(!status.tradingOpen) return Promise.reject({ ui:'지금은 거래 가능 시간이 아니에요.' });
  qty = Math.max(0, Math.floor(qty));
  if(!(qty > 0)) return Promise.reject({ ui:'수량을 입력하세요.' });
  if(!tickLoaded(status.idx)) return Promise.reject({ ui:'지금 시세를 불러오는 중이에요. 잠시 후 다시 시도하세요.' });
  var price = priceAt(stockId, status.idx);
  var total = qty * price;
  var have = s.holdings[stockId] || 0;
  var costs = calcCosts(side, total);
  var newCash, newQty;
  if(side === 'buy'){
    if(s.cash < total + costs.cost) return Promise.reject({ ui:'현금이 부족해요. (수수료 포함 ' + won(total + costs.cost) + ' 필요)' });
    newCash = s.cash - total - costs.cost; newQty = have + qty;
  } else {
    if(have < qty) return Promise.reject({ ui:'보유 수량이 부족해요.' });
    newCash = s.cash + total - costs.cost; newQty = have - qty;
  }
  var tid = 't' + nowMs().toString(36) + Math.random().toString(36).slice(2, 7);
  var upd = {};
  upd['students/' + me.key + '/cash'] = newCash;
  upd['students/' + me.key + '/holdings/' + stockId] = newQty > 0 ? newQty : null;
  upd['trades/' + me.key + '/' + tid] = { ts: firebase.database.ServerValue.TIMESTAMP, stockId:stockId, side:side, qty:qty, price:price, total:total };
  return FB.db.ref().update(upd);
}

/* ============ 6. FORMAT HELPERS ============ */
function won(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; }
function pctStr(p){ var s=(p>=0?'+':'')+p.toFixed(1)+'%'; return s; }
function pctClass(p){ return p >= 0 ? 'up-text' : 'down-text'; }
function esc(str){ return String(str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============ 7. SPARKLINE SVG ============ */
// 긴 시세 배열을 최대 maxN 개로 고르게 추린다(첫 값과 마지막 값은 항상 포함).
function downsample(values, maxN){
  var n = values.length;
  if(n <= maxN) return values;
  var out = [];
  for(var i=0;i<maxN;i++){ out.push(values[Math.round(i * (n-1) / (maxN-1))]); }
  return out;
}
function sparkline(values, w, h, strokeColor){
  values = downsample(values, 60);
  if(values.length < 2) values = [values[0]||0, values[0]||0];
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if(min === max){ min -= 1; max += 1; }
  var n = values.length;
  var pts = values.map(function(v,i){
    var x = (i/(n-1)) * w;
    var y = h - ((v - min)/(max-min)) * h;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var path = 'M' + pts.join(' L');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
    '<path d="'+path+'" fill="none" stroke="'+strokeColor+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function chartSvg(values, w, h, strokeColor){
  values = downsample(values, 320);
  if(values.length < 2) values = [values[0]||0, values[0]||0];
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  if(min === max){ min -= 1; max += 1; }
  var n = values.length, pad = 4;
  var pts = values.map(function(v,i){
    var x = (i/(n-1)) * (w-2*pad) + pad;
    var y = (h-2*pad) - ((v - min)/(max-min)) * (h-2*pad) + pad;
    return [x,y];
  });
  var line = 'M' + pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' L');
  var area = line + ' L' + pts[pts.length-1][0].toFixed(1) + ',' + h + ' L' + pts[0][0].toFixed(1) + ',' + h + ' Z';
  return '<svg class="chartbox" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
    '<path d="'+area+'" fill="'+strokeColor+'" opacity="0.10" stroke="none"/>' +
    '<path d="'+line+'" fill="none" stroke="'+strokeColor+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

// 시세 데이터가 아직 안 올라왔거나 이 페이지와 짝이 안 맞을 때 알림(게임이 시작된 뒤에만 학생에게 보임)
function marketDataBanner(status){
  if(!MKT.gotMeta || marketReady() || status.phase === 'before') return '';
  var msg = !MKT.meta ? '시세 데이터가 아직 준비되지 않았어요. 선생님께 알려 주세요.'
                      : '시세 데이터 버전이 이 페이지와 맞지 않아요. 선생님께 알려 주세요.';
  return '<div class="card" style="border-color:var(--down);"><div class="hint" style="margin:0;color:var(--down);font-weight:600;">' + msg + '</div></div>';
}
function renderMarketList(status){
  var rows = STOCKS.map(function(st){
    var price = priceAt(st.id, status.idx);
    var base = baselinePrice(st.id, status.day);
    var chg = (price/base - 1) * 100;
    var cls = chg >= 0 ? 'up-text' : 'down-text';
    var slice = seriesUpTo(st.id, status.idx);
    return '<div class="stock-item" data-stock="' + st.id + '">' +
      sparkline(slice, 64, 28, chg>=0 ? 'var(--up)' : 'var(--down)') +
      '<div class="sp"><div class="nm">' + esc(st.name) + (st.etf ? ' <span class="tag tag-admin">ETF</span>' : '') + '</div><div class="sector">' + esc(st.sector) + '</div></div>' +
      '<div class="price-col"><div class="pr mono">' + price.toLocaleString('ko-KR') + '</div><div class="chg mono ' + cls + '">' + pctStr(chg) + '</div></div>' +
      '</div>';
  }).join('');
  var iv = indexAt(status.idx), ibase = indexBaseline(status.day), ichg = (iv / ibase - 1) * 100;
  var itotal = (iv / MARKET.index.base - 1) * 100;
  var icolor = ichg >= 0 ? 'var(--up)' : 'var(--down)';
  var indexCard = '<div class="card index-card">' +
    '<div class="row"><div><h2 style="margin:0 0 2px;">도개지수</h2><div class="index-val mono">' + fmtIndex(iv) + '</div>' +
      '<div class="mono ' + pctClass(ichg) + '" style="font-size:13px;font-weight:600;">' + pctStr(ichg) + ' (전일 대비) · 시작 대비 ' + pctStr(itotal) + '</div></div>' +
      '<div class="index-spark">' + sparkline(seriesUpTo(null, status.idx), 120, 44, icolor) + '</div></div>' +
    '<div class="hint" style="margin-top:8px;">10종목 전체의 평균적인 움직임이에요(시작 1,000). 내 수익률이 지수보다 높은지 비교해 보세요.</div>' +
    '</div>';
  return '<main>' + marketDataBanner(status) + indexCard +
    '<div class="card"><h2>전 종목 시세 (' + STOCKS.length + '종목)</h2>' + rows + '</div>' +
    '</main>';
}

function tradeClosedHint(status){
  if(status.phase === 'before') return '아직 게임이 시작되지 않았어요.';
  if(status.phase === 'ended') return '게임이 모두 종료됐어요. 수고했어요!';
  if(status.nextTradeMs) return '지금은 거래 가능 시간이 아니에요. 다음 거래는 ' + fmtClock(status.nextTradeMs) + '(' + status.nextTradeLabel + ')부터 가능해요.';
  if(status.phase === 'closed' && status.nextOpen) return '오늘 거래는 모두 끝났어요. 다음 거래는 ' + fmtDateShort(status.nextOpen) + '부터예요.';
  return '지금은 거래 시간이 아니에요.';
}

function renderPortfolio(status){
  var me = UI.me;
  if(!me) return renderLogin();
  var s = STATE.students[me.key];
  var total = currentTotalValue(s, status.idx);
  var ret = (total/START_CAPITAL - 1) * 100;
  var holdingsRows = Object.keys(s.holdings).map(function(id){
    var qty = s.holdings[id]; var st = STOCK_MAP[id]; var price = priceAt(id, status.idx);
    var val = qty*price;
    return { id:id, name:st.name, qty:qty, price:price, val:val };

function scriptedNotices(status){
  if(!STATE.config.day1Date) return [];
  var base = day1Ms(), list = [];
  // 주말 뉴스는 토·일에 미리 보이고, 주가에는 월요일 개장가에 반영된다(공개 시각 rel 이 이미 표시 시각이다).
  MKT.events.forEach(function(ev){
    var ts = base + ev.rel;
    if(ts <= status.nowMs){ list.push({ ts:ts, stockId:ev.s, type:ev.t, headline:ev.h, body:ev.b, key:'ev'+ev.i }); }
  });
  return list;
}
function renderNotices(status){
  var scripted = scriptedNotices(status);
  var custom = (STATE.config.customNotices||[]).map(function(n){ return { ts:n.ts, type:'admin', headline:n.title, body:n.body, key:'c'+n.ts }; });
  var all = scripted.concat(custom).sort(function(a,b){ return b.ts - a.ts; });
  if(!all.length){
    return '<main><div class="card"><h2>실시간 뉴스</h2><div class="empty">아직 발표된 뉴스가 없어요. 장이 열리면 실시간으로 올라와요.</div></div></main>';
  }
  var tagMap = { profile:['news','기업소개'], news:['news','뉴스'], rumor:['rumor','찌라시'], debunk:['debunk','정정보도'], admin:['admin','공지'] };
  var total = all.length;
  var rows = all.slice(0, UI.noticeLimit).map(function(n){
    var tag = tagMap[n.type] || ['news','뉴스'];
    var stName = n.stockId ? STOCK_MAP[n.stockId].name : '';
    return '<div class="notice"><div class="head">' +
      '<span class="tag tag-' + tag[0] + '">' + tag[1] + '</span>' +
      (stName ? '<span class="stockname">' + esc(stName) + '</span>' : '') +
      '<span class="ts mono">' + fmtDateShort(n.ts) + '</span></div>' +
      '<p class="headline">' + esc(n.headline) + '</p>' +
      '<p class="body">' + esc(n.body) + '</p></div>';
  }).join('');
  var more = total > UI.noticeLimit ? '<button class="btn btn-ghost" id="btn-more-news" style="margin-top:10px;">이전 뉴스 더 보기 (' + (total - UI.noticeLimit) + '건)</button>' : '';
  return '<main><div class="card"><h2>실시간 뉴스</h2>' + rows + more + '</div></main>';
}

function renderRanking(status){

function renderBoot(){
  var msg, title = '접속 중…', retry = false;
  if(FB.phase === 'error'){
    title = '실행할 수 없어요'; retry = true;
    var d = FB.errorDetail || '';
    if(FB.errorKind === 'no-config') msg = '(선생님용) 아직 Firebase 설정값이 들어 있지 않은 파일이에요. 설정값을 넣어 만든 파일로 바꿔 올려 주세요.';
    else if(FB.errorKind === 'no-dburl') msg = '(선생님용) 설정값에 <code>databaseURL</code> 이 없어요. Firebase 콘솔에서 Realtime Database 를 먼저 만든 뒤, 웹 앱 설정값을 다시 복사해 주세요.';
    else if(FB.errorKind === 'no-sdk') msg = '필요한 구성요소를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    else if(FB.errorKind === 'no-crypto') msg = '이 주소는 보안 연결(https)이 아니어서 실행할 수 없어요. https:// 로 시작하는 주소로 접속해 주세요.';
    else if(FB.errorKind === 'auth' && /operation-not-allowed|admin-restricted/i.test(d)) msg = '(선생님용) Firebase 콘솔 › Authentication › 로그인 방법에서 <b>익명</b>을 사용 설정해 주세요.';
    else if(FB.errorKind === 'auth') msg = '서버에 접속하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    else if(FB.errorKind === 'rules') msg = '(선생님용) 데이터베이스 규칙이 아직 게시되지 않았어요. 안내서의 규칙을 붙여넣고 <b>게시</b>를 눌러 주세요.';
    else msg = '데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.';
    if(d) msg += '<br><span style="color:var(--ink-faint);font-size:11.5px;">(' + esc(FB.errorKind) + ': ' + esc(d) + ')</span>';
  } else if(UI.joining){
    title = '참가 처리 중…'; msg = '';
  } else {
    msg = '';
  }
  return '<main><div class="card boot-card"><h1>' + title + '</h1>' + (msg ? '<p>' + msg + '</p>' : '') +
    (retry ? '<button class="btn btn-ghost" id="btn-reload" style="margin-top:14px;">새로고침</button>' : '') +
    '</div></main>';
}

  else if(UI.tab === 'portfolio') mainHtml = renderPortfolio(status);
  else if(UI.tab === 'notices') mainHtml = renderNotices(status);
  else if(UI.tab === 'journal') mainHtml = renderJournal(status);
  else if(UI.tab === 'ranking') mainHtml = renderRanking(status);
  else mainHtml = renderMarketList(status);

  var showTabbar = !booting && !UI.joining && !!student && !needsOnboarding;
  var tabbarHtml = showTabbar ? renderTabbar() : '';
  var modalHtml = booting ? '' : renderAdminModal();

  // 바뀐 부분만 다시 그린다. 다른 학생의 거래가 들어올 때마다 화면 전체를 갈아엎으면 티커 애니메이션이
  // 처음으로 튀고, 이벤트 핸들러도 매번 다시 붙여야 하기 때문.
  if(LAST_HTML.top !== topHtml){ LAST_HTML.top = topHtml; document.getElementById('vr-top').innerHTML = topHtml; }
  if(LAST_HTML.ticker !== tickerHtml){
    LAST_HTML.ticker = tickerHtml;
    document.getElementById('vr-ticker').innerHTML = tickerHtml;
    var track = document.querySelector('.tickertrack');
    if(track) track.addEventListener('click', function(){ track.classList.toggle('paused'); });
  }
  // 화면이 바뀌면(탭 이동, 종목 열기, 참가 완료 등) 맨 위부터 보이게 한다.
  var viewKey = (booting || UI.joining) ? 'boot' : (!UI.me || !student) ? 'login' : needsOnboarding ? 'onboard' : (UI.detailStock ? 'detail:' + UI.detailStock : 'tab:' + UI.tab);
  var viewChanged = LAST_HTML.view !== viewKey;
  LAST_HTML.view = viewKey;
  var bodyKey = mainHtml + '\u0001' + tabbarHtml + '\u0001' + modalHtml;
  if(LAST_HTML.body !== bodyKey){
    LAST_HTML.body = bodyKey;
    document.getElementById('vr-main').innerHTML = mainHtml;
    var tabbarExisting = document.querySelector('.tabbar');
    if(tabbarExisting) tabbarExisting.remove();
    if(tabbarHtml) document.getElementById('app').insertAdjacentHTML('beforeend', tabbarHtml);
    var overlay = document.getElementById('overlay-root');
    var existingModal = overlay.querySelector('.modal-backdrop');
    if(existingModal) existingModal.remove();
    if(modalHtml) overlay.insertAdjacentHTML('afterbegin', modalHtml);
    wireEvents();
  }
  if(viewChanged) window.scrollTo(0, 0);
}

// 서버에서 새 데이터가 왔을 때(또는 시계가 넘어갔을 때)의 다시 그리기. 입력 중이거나 관리자 창이
// 열려 있으면 입력 내용이 지워지지 않도록 미뤄 뒀다가, 입력이 끝나면 그린다.
var renderPending = false;
function isTyping(){
  var ae = document.activeElement;
  return !!(ae && ((ae.tagName === 'INPUT' && ae.type !== 'checkbox') || ae.tagName === 'TEXTAREA'));
}
function liveRender(){
  if(isTyping() || UI.adminOpen){ renderPending = true; return; }
  renderPending = false;
  render();
}
document.addEventListener('focusout', function(){
  if(!renderPending) return;
  setTimeout(function(){ if(renderPending && !isTyping() && !UI.adminOpen){ renderPending = false; render(); } }, 0);
});

function failToast(err, fallback){
  if(err && err.ui){ toast(err.ui); return; }
  if(isDenied(err)){ toast('저장이 거부됐어요. 새로고침한 뒤 다시 시도해 주세요.'); return; }
  toast(fallback || '저장에 실패했어요. 잠시 후 다시 시도해 주세요.');
}

/* ============ 13. EVENTS ============ */
function wireEvents(){
  var byId = function(id){ return document.getElementById(id); };

  if(byId('btn-reload')) byId('btn-reload').addEventListener('click', function(){ location.reload(); });
  if(byId('btn-more-news')) byId('btn-more-news').addEventListener('click', function(){ UI.noticeLimit += 60; render(); });

  if(byId('btn-login')){
    var doLogin = function(){
      var code = byId('in-code').value.trim();
      var name = byId('in-name').value.trim();
      var pin = byId('in-pin').value.trim();
      var errEl = byId('login-err');
      var showErr = function(m){ var el = byId('login-err'); if(el){ el.textContent = m; el.hidden = false; } else toast(m); };
      if(!code || !name){ showErr('학년/반/번호와 이름을 모두 입력하세요.'); return; }
      if(!/^\d{4}$/.test(pin)){ showErr('비밀번호는 숫자 4자리로 입력하세요.'); return; }
      if(!FB.connected){ showErr('인터넷 연결을 확인한 뒤 다시 시도하세요.'); return; }
      errEl.hidden = true;
      byId('btn-login').disabled = true;
      UI.loginDraft = { code:code, name:name };
      loginStudent(code, name, pin).then(function(){
        UI.loginDraft = null;
        render();
      }, function(err){
        render();   // 참가 화면을 다시 그린 뒤(입력값은 loginDraft 로 복원) 오류를 표시한다
        showErr(err && err.ui ? err.ui : '참가하지 못했어요. 잠시 후 다시 시도해 주세요.');
      });
      render();     // "참가 처리 중…" 표시
    };
    byId('btn-login').addEventListener('click', doLogin);
    byId('in-pin').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
  }

  if(byId('ob-check1')) byId('ob-check1').addEventListener('change', function(){ UI.onboardCheck1 = byId('ob-check1').checked; render(); });
  if(byId('ob-check2')) byId('ob-check2').addEventListener('change', function(){ UI.onboardCheck2 = byId('ob-check2').checked; render(); });
  if(byId('btn-onboard-start')){
    byId('btn-onboard-start').addEventListener('click', function(){
      var s = STATE.students[UI.me.key];
      if(!s || !(UI.onboardCheck1 && UI.onboardCheck2)) return;
      byId('btn-onboard-start').disabled = true;
      setOnboarded().then(function(){ toast('환영해요! 이제 투자를 시작할 수 있어요.'); }, function(err){ failToast(err); render(); });
    });
  }

  document.querySelectorAll('.journal-reason').forEach(function(ta){
    ta.addEventListener('input', function(){ UI.drafts[ta.getAttribute('data-tid')] = ta.value; });
  });
  document.querySelectorAll('.journal-save-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var tid = btn.getAttribute('data-tid');
      var ta = document.querySelector('.journal-reason[data-tid="' + tid + '"]');
      if(!ta) return;
      var text = ta.value;
      btn.disabled = true;
      saveJournal(tid, text).then(function(){
        delete UI.drafts[tid];
        toast('매매일지를 저장했어요.');
        render();
      }, function(err){ failToast(err); btn.disabled = false; });
    });
  });

  document.querySelectorAll('.tabbar button').forEach(function(btn){
    btn.addEventListener('click', function(){ UI.tab = btn.getAttribute('data-tab'); UI.detailStock = null; UI.noticeLimit = 60; render(); });
  });

  document.querySelectorAll('.stock-item').forEach(function(el){
    el.addEventListener('click', function(){ UI.detailStock = el.getAttribute('data-stock'); UI.qty = 1; UI.tradeSide='buy'; render(); });
  });
  if(byId('btn-back-market')){ byId('btn-back-market').addEventListener('click', function(){ UI.detailStock = null; render(); }); }

  if(byId('seg-buy')) byId('seg-buy').addEventListener('click', function(){ UI.tradeSide='buy'; render(); });
  if(byId('seg-sell')) byId('seg-sell').addEventListener('click', function(){ UI.tradeSide='sell'; render(); });
  if(byId('qty-minus')) byId('qty-minus').addEventListener('click', function(){ UI.qty = Math.max(1, UI.qty-1); render(); });
  if(byId('qty-plus')) byId('qty-plus').addEventListener('click', function(){ UI.qty = UI.qty+1; render(); });
  if(byId('qty-input')) byId('qty-input').addEventListener('change', function(){ var v = parseInt(byId('qty-input').value,10); UI.qty = (v && v>0) ? v : 1; render(); });

  if(byId('btn-confirm-trade')){
    byId('btn-confirm-trade').addEventListener('click', function(){
      var side = UI.tradeSide;
      byId('btn-confirm-trade').disabled = true;
      submitTrade(UI.detailStock, side, UI.qty).then(function(){
        toast((side==='buy'?'매수':'매도') + ' 완료!');
        UI.qty = 1; render();
      }, function(err){
        failToast(err);
        LAST_HTML.body = null; render();   // 버튼 상태를 원래대로 되돌린다
      });
    });
  }

  if(byId('btn-logout')){
    byId('btn-logout').addEventListener('click', function(){
      if(!confirm('이 기기에서 로그아웃할까요? 같은 학번·이름·비밀번호로 다시 들어올 수 있어요.')) return;
      var key = UI.me.key;
      signOutLocal();
      FB.db.ref('owners/' + key + '/' + FB.uid).remove().then(null, function(){});
      render();
    });
  }

  /* ---- 관리자 ---- */
  var closeAdmin = function(){
    var wasUnlocked = UI.adminUnlocked;
    UI.adminOpen = false; UI.adminUnlocked = false;
    if(wasUnlocked && FB.uid) FB.db.ref('admins/' + FB.uid).remove().then(null, function(){});
    renderPending = false;
    render();
  };
  if(byId('btn-admin')) byId('btn-admin').addEventListener('click', function(){ UI.adminOpen = true; render(); });
  if(byId('admin-close')) byId('admin-close').addEventListener('click', closeAdmin);
  if(byId('admin-backdrop')) byId('admin-backdrop').addEventListener('click', function(e){ if(e.target.id==='admin-backdrop') closeAdmin(); });

  var adminErr = function(m){ var el = byId('admin-err'); if(el){ if(m) el.textContent = m; el.hidden = false; } };
  if(byId('admin-unlock')){
    var tryUnlock = function(){
      var pw = byId('admin-pw').value;
      if(!pw){ adminErr(); return; }
      byId('admin-unlock').disabled = true;
      adminUnlock(pw, false).then(function(){ UI.adminUnlocked = true; render(); }, function(err){
        if(byId('admin-unlock')) byId('admin-unlock').disabled = false;
        adminErr(err && err.ui === 'wrong' ? '비밀번호가 올바르지 않아요.' : '확인하지 못했어요. 인터넷 연결을 확인하세요.');
      });
    };
    byId('admin-unlock').addEventListener('click', tryUnlock);
    byId('admin-pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });
  }
  if(byId('admin-setup')){
    byId('admin-setup').addEventListener('click', function(){
      var pw = byId('admin-pw').value, pw2 = byId('admin-pw2').value;
      if(pw.length < 6){ adminErr('6자 이상으로 정해 주세요.'); return; }
      if(pw !== pw2){ adminErr('두 번 입력한 비밀번호가 서로 달라요.'); return; }
      byId('admin-setup').disabled = true;
      adminUnlock(pw, true).then(function(){ UI.adminUnlocked = true; toast('관리자 비밀번호를 설정했어요.'); render(); }, function(err){
        if(byId('admin-setup')) byId('admin-setup').disabled = false;
        adminErr(err && err.ui === 'wrong' ? '이미 다른 비밀번호가 설정돼 있어요.' : '설정하지 못했어요. 인터넷 연결을 확인하세요.');
      });
    });
  }
  if(byId('admin-upload-market')){
    byId('admin-upload-market').addEventListener('click', function(){
      var f = byId('admin-market-file').files && byId('admin-market-file').files[0];
      if(!f){ toast('market_secret.json 파일을 먼저 골라 주세요.'); return; }
      var rd = new FileReader();
      rd.onload = function(){
        var obj = null; try{ obj = JSON.parse(rd.result); }catch(e){ obj = null; }
        adminUploadMarket(obj).then(function(){ toast('시장 데이터를 올렸어요.'); render(); }, function(err){ failToast(err, '올리지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'); });
      };
      rd.onerror = function(){ toast('파일을 읽지 못했어요.'); };
      rd.readAsText(f);
    });
  }
  if(byId('admin-save-day1')){
    byId('admin-save-day1').addEventListener('click', function(){
      var v = byId('admin-day1').value;
      if(!v){ toast('날짜를 선택하세요.'); return; }
      adminSetDay1(v).then(function(){ toast('시작일이 저장됐어요.'); render(); }, function(err){ failToast(err); });
    });
  }
  if(byId('admin-add-notice')){
    byId('admin-add-notice').addEventListener('click', function(){
      var title = byId('admin-notice-title').value.trim();
      var body = byId('admin-notice-body').value.trim();
      if(!title || !body){ toast('제목과 내용을 입력하세요.'); return; }
      adminAddNotice(title, body).then(function(){
        toast('뉴스를 등록했어요.');
        if(byId('admin-notice-title')){ byId('admin-notice-title').value = ''; byId('admin-notice-body').value = ''; }
      }, function(err){ failToast(err); });
    });
  }
  if(byId('admin-save-pw')){
    byId('admin-save-pw').addEventListener('click', function(){
      var v = byId('admin-pw-new').value;
      if(v.length < 6){ toast('새 비밀번호는 6자 이상으로 정해 주세요.'); return; }
      adminChangePassword(v).then(function(){ toast('비밀번호를 변경했어요.'); if(byId('admin-pw-new')) byId('admin-pw-new').value = ''; }, function(err){ failToast(err); });
    });
  }
  document.querySelectorAll('.admin-reset-pin').forEach(function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-key'), s = STATE.students[key];
      if(!s || !confirm(s.code + ' ' + s.name + ' 학생의 비밀번호를 초기화할까요? 자산은 그대로 유지돼요.')) return;
      adminResetPin(key).then(function(){ toast('비밀번호를 초기화했어요: ' + s.name); }, function(err){ failToast(err); });
    });
  });
  document.querySelectorAll('.admin-delete-student').forEach(function(btn){
    btn.addEventListener('click', function(){
      var key = btn.getAttribute('data-key'), s = STATE.students[key];
      if(!s || !confirm(s.code + ' ' + s.name + ' 학생의 계정을 삭제할까요? 자산·거래·매매일지가 모두 지워지고 되돌릴 수 없어요.')) return;
      adminDeleteStudent(key).then(function(){ toast('삭제했어요: ' + s.name); render(); }, function(err){ failToast(err); });
    });
  });
  if(byId('admin-reset-all')){
    byId('admin-reset-all').addEventListener('click', function(){
      if(!confirm('정말 모든 학생 데이터를 초기화할까요? 되돌릴 수 없어요.')) return;
      adminResetAll().then(function(){ toast('전체 게임을 초기화했어요.'); render(); }, function(err){ failToast(err); });
    });
  }
}

/* ============ 14. CLOCK TICK ============ */
// 분이 넘어가면 시계와 주가가 따라 움직이도록 주기적으로 다시 그린다(바뀐 부분만 실제로 갱신됨).
setInterval(liveRender, 10000);
setInterval(marketSync, 2000);

// 개발자도구 단축키·우클릭 막기(겉치레일 뿐, 실제 보호는 데이터베이스 규칙이 한다). 입력칸의 우클릭(붙여넣기)은 허용.
document.addEventListener('keydown', function(e){
  var k = (e.key || '').toUpperCase();
  if(k === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) ||
     ((e.ctrlKey || e.metaKey) && e.altKey && (k === 'I' || k === 'J' || k === 'C')) || ((e.ctrlKey || e.metaKey) && k === 'U')){
    e.preventDefault();
  }
});
document.addEventListener('contextmenu', function(e){
  var t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  e.preventDefault();
});

/* ============ 15. BOOT ============ */
render();
bootFirebase();

})();

</script>

</html>
